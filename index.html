acity='0.20'/%3E%3Crect width='100%' height='100%' filter='url(%23m)'/%3E%3Crect width='100%' height='100%' filter='url(%23n)'/%3E%3C/svg%3E");--bg:#0a0a0b;--card:#faf9f7;--line:#e8e5df;--tx:#17171a;--mu:#a9a9b1;--or:#b85a24;--or2:#a04d1d;--tint:#f7ebe2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:#f5f5f5;font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:600;margin:0;line-height:1.12;letter-spacing:-.01em}
em{font-style:italic;color:#e07a3a}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#0a0a0bed;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff1f}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;white-space:nowrap}
.logo b{font:600 22px 'Playfair Display',serif;color:var(--or);letter-spacing:0}
.links{display:flex;gap:4px;align-items:center;overflow-x:auto}
.links a{padding:8px 12px;font-size:14px;font-weight:500;color:var(--mu);border-radius:8px;white-space:nowrap;transition:.2s}
.links a:hover{color:#fff}.links a.on{color:#fff;background:#ffffff1a}
.links a.btn{color:#fff;background:var(--or);margin-left:6px}
.btn{display:inline-block;background:var(--or);color:#fff;border:1px solid var(--or);border-radius:10px;font:600 15px Inter,sans-serif;padding:13px 24px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--or2);transform:translateY(-1px);box-shadow:0 8px 20px #b85a2433}
.btn.ghost{background:#fff;color:var(--tx);border-color:#d8d4cc}
.btn.ghost:hover{border-color:var(--tx);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--tint);color:var(--or2);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--or)}
@keyframes up{from{opacity:0;transform:translateY(20px)}}

.hero{padding:76px 0 68px;background:linear-gradient(180deg,#ffffff08,transparent)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:52px;align-items:center}
.hero .wrap>*{animation:up .8s both}.hero .wrap>*:nth-child(2){animation-delay:.15s}
.hero h1{font-size:clamp(38px,6.4vw,66px);margin:22px 0 18px}
.hero p{color:var(--mu);max-width:470px;font-size:18px;margin:0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.panel{background:#17171a;color:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 60px #17171a2e}
.panel h3{font-size:25px;margin-bottom:20px}
.stp{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #ffffff1f}
.stp b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--or);display:grid;place-items:center;font-size:14px}
.stp small{display:block;color:#a9a9b1;font-size:13px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#d0d0d6}
.meta span{background:#ffffff14;padding:6px 12px;border-radius:99px}
section{padding:72px 0}
.brick{background:#e7d6c7 var(--brk);border-radius:26px;padding:30px;box-shadow:inset 0 0 0 1px #0000001f,0 24px 50px #3a1a0a33}
.brick .panel{box-shadow:0 18px 40px #00000059}
footer{position:relative}footer::before{content:"";display:block;height:20px;margin:-40px 0 36px;background:#e7d6c7 var(--brk)}
h2{font-size:clamp(28px,4.6vw,42px);margin-bottom:10px}
.sub{color:var(--mu);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 1px 2px #0000000d;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px #0000001a;border-color:#d9c4b4}
.card h3{font-size:22px;margin:14px 0 6px}
.ic{width:46px;height:46px;display:grid;place-items:center;background:var(--tint);border-radius:12px;font-size:22px}
.mu{color:var(--mu);font-size:14px}
.price{font:600 22px Inter,sans-serif;color:var(--or);margin-top:10px}
.stat{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;color:var(--mu);font-size:14px}
.stat b{display:block;font:600 30px 'Playfair Display',serif;color:var(--tx)}
.ev{background:#17171a;color:#fff;border-radius:24px;padding:38px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.ev h3{font-size:34px;margin:14px 0 6px}.ev div div{color:#b8b8c0}
.ev .tag{background:#ffffff1a;color:#f0c9ae}
.ev .btn{background:#fff;color:var(--tx);border-color:#fff}
.rv{opacity:0;transform:translateY(24px);transition:.7s}.rv.in{opacity:1;transform:none}
input,select{width:100%;background:#fff;color:var(--tx);border:1px solid #d8d4cc;border-radius:10px;padding:12px 14px;font:15px Inter,sans-serif;margin:6px 0 16px}
input:focus,select:focus{outline:2px solid var(--or);border-color:transparent}
label{font-size:13px;color:var(--mu);font-weight:500}
.box{max-width:450px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 20px 50px #0000001a}
.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.chip{border:1px solid #d8d4cc;background:#fff;color:var(--tx);padding:9px 15px;border-radius:99px;cursor:pointer;font:500 14px Inter,sans-serif;transition:.2s}
.chip:hover:not(:disabled){border-color:var(--or)}
.chip.on{background:var(--or);border-color:var(--or);color:#fff}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:12px;color:var(--mu);font-weight:600}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx);cursor:pointer;font:14px Inter,sans-serif}
.cal button:hover:not(:disabled){border-color:var(--or);background:var(--tint)}
.cal button.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.cal button:disabled{opacity:.25;cursor:not-allowed}
.cal i{visibility:hidden}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.st{font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--tint);color:var(--or2)}.st.c{background:#efefef;color:#6a6a72}
.wide{overflow-x:auto}
.msg{background:var(--tint);border-left:3px solid var(--or);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:14px}
footer{background:#111113;padding:40px 0;color:#b8b8c0;font-size:14px;text-align:center}
footer a{color:#e0a47c}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#0b2a16;font-weight:600;border-radius:99px;padding:12px 18px;z-index:9;box-shadow:0 8px 24px #0003}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:var(--or);z-index:40}
nav.sc{box-shadow:0 6px 24px #0000000f}
.card{position:relative;overflow:hidden}
.btn,.chip,.cal button{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#17171a;color:#fff;padding:13px 22px;border-radius:99px;opacity:0;transition:.4s;z-index:50;font-size:14px;font-weight:500;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
/* ===== Visual de barbearia clássica ===== */
:root{--or:#f26a10;--or2:#d4560a;--tint:#fdebd9;--card:#f4ecdc;--line:#d9c9a8;--gold:#ff8a1f;--pole:repeating-linear-gradient(-45deg,#b3202a 0 10px,#fff 10px 20px,#1f4fa8 20px 30px,#fff 30px 40px)}
body{background:#0c0b0a radial-gradient(1200px 520px at 50% -8%,#3a2614 0,transparent 70%) no-repeat}
em{color:var(--gold)}
h1,h2{text-transform:uppercase;letter-spacing:.03em;font-weight:700}
h1{font-size:clamp(34px,5.6vw,58px)}
h2::after{content:"";display:block;width:76px;height:3px;margin-top:14px;background:var(--gold);box-shadow:0 7px 0 -1px var(--gold)}
.box h2::after,.ev h3::after{display:none}
nav{background:#0c0b0af2;border-bottom:1px solid #ff8a1f55}
nav::after{content:"";display:block;height:6px;background:var(--pole);background-size:56.57px 100%;animation:pole 2.4s linear infinite}
@keyframes pole{to{background-position:56.57px 0}}
@keyframes polev{to{background-position:0 56.57px}}
.logo b{color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
.logo span{text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.pole{flex:none;width:15px;height:36px;border-radius:8px;border:2px solid var(--gold);background:repeating-linear-gradient(45deg,#b3202a 0 10px,#fff 10px 20px,#1f4fa8 20px 30px,#fff 30px 40px);background-size:100% 56.57px;animation:polev 2.4s linear infinite;box-shadow:0 0 0 2px #0c0b0a}
.links a{text-transform:uppercase;letter-spacing:.09em;font-size:12px}
.links a.on{background:none;color:var(--gold);box-shadow:inset 0 -2px var(--gold);border-radius:0}
.btn{text-transform:uppercase;letter-spacing:.09em;font-size:13px;border-radius:4px;background:linear-gradient(180deg,#ff8a1f,#e0610f);border-color:#ff8a1f}
.btn:hover{background:linear-gradient(180deg,#ff9a3a,#ee6f12);box-shadow:0 8px 22px #ff7a1a55}
.hero .btn.ghost{background:transparent;color:var(--gold);border-color:var(--gold)}
.hero .btn.ghost:hover{background:#ff8a1f1f}
.tag{background:transparent;color:var(--gold);border:1px solid #ff8a1f88;border-radius:3px;text-transform:uppercase;letter-spacing:.14em;font-size:11px}
.tag i{background:var(--gold)}
.hero{position:relative;padding-bottom:96px;background:radial-gradient(800px 380px at 85% 0,#ff8a1f1f,transparent 65%),repeating-linear-gradient(90deg,#ffffff06 0 2px,transparent 2px 16px)}
.hero::after,footer::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:conic-gradient(#0c0b0a 25%,#efe6d2 0 50%,#0c0b0a 0 75%,#efe6d2 0) 0 0/24px 24px;border-top:2px solid var(--gold)}
.hero .wrap>div:first-child>p{border-left:3px solid var(--gold);padding-left:16px}
.card{background:var(--card);border:1px solid var(--gold);outline:1px solid #e0610f66;outline-offset:-7px;border-radius:6px}
.card:hover{border-color:var(--or);box-shadow:0 18px 40px #00000066}
.card h3,.card .price{text-transform:uppercase;letter-spacing:.04em}
.ic{background:#17171a;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.stat{background:#141312;border:1px solid #ff8a1f66;border-radius:6px;color:#bdb6a6;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.stat b{color:var(--gold);letter-spacing:0}
.feat{border-radius:6px}
.brick,.panel,.ev,.box,.chip,.cal button,input,select{border-radius:6px}
.brick{box-shadow:inset 0 0 0 3px #17171a,inset 0 0 0 4px var(--gold),0 24px 50px #000000aa}
.panel{border:1px solid #ff8a1f66}
.panel h3{text-transform:uppercase;letter-spacing:.05em;color:var(--gold)}
.stp b{background:var(--or);box-shadow:0 0 0 2px var(--gold)}
.ev{position:relative;border:1px solid #ff8a1f88;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--pole)}
.box{border:1px solid var(--gold);background:var(--card)}
.chip.on,.cal button.on{background:var(--or);color:#fff;border-color:var(--gold)}
footer{position:relative;background:#0c0b0a;padding-bottom:72px}
footer::before{height:8px!important;background:var(--pole)!important;background-size:56.57px 100%!important;animation:pole 2.4s linear infinite}
footer a{color:var(--gold)}
footer h4{color:var(--gold);text-transform:uppercase;letter-spacing:.12em}
#pg{background:var(--pole);height:4px}
@media(max-width:760px){.hero{padding-bottom:84px}}
/* ===== Estrutura moderna ===== */
h1,h2,h3{font-family:Inter,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
h1{line-height:1.02}em{font-style:normal}

function nextC(a){const k=today()+nowT(),x=a.find(y=>y.status=='confirmado'&&y.date+y.time>=k);if(!x)return '';const dd=Math.round((new Date(x.date+'T00:00')-new Date(today()+'T00:00'))/864e5);return `<div class="nx"><div><span class="mu">Próximo horário</span><h3>${e(x.svcName||'')}</h3><div class="mu">${fd(x.date)} às ${e(x.time)}${x.barber?' com '+e(barName(x.barber)):''} · ${dd==0?'hoje':dd==1?'amanhã':'em '+dd+' dias'}</div></div><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${waOf(x.barber)}?text=${encodeURIComponent('Olá! Confirmando meu horário: '+(x.svcName||'')+(x.barber?' com '+barName(x.barber):'')+' em '+fd(x.date)+' às '+x.time+'.')}">Falar com ${x.barber?e(barName(x.barber)):'a barbearia'}</a></div>`}
function chartH(act){const ds=[...Array(7)].map((_,i)=>addD(today(),i)),c=ds.map(d=>act.filter(a=>a.date==d).length),mx=Math.max(1,...c),rk=S.services.map(v=>({n:v.name,c:act.filter(a=>[].concat(a.svc).some(x=>x==v.id)).length})).sort((a,b)=>b.c-a.c);
return `<div class="sim" style="margin-top:0"><h3>Próximos 7 dias</h3><div class="bars">${ds.map((d,i)=>`<div class="bar"><span>${c[i]}</span><i style="height:${8+c[i]/mx*100}px"></i><small>${fd(d).slice(0,5)}</small></div>`).join('')}</div></div><div class="sim"><h3>Serviços mais agendados</h3>${rk.map(r=>`<div class="hr"><span>${e(r.n)}</span><b>${r.c}</b></div>`).join('')}</div>`}
const fine=matchMedia('(hover:hover)').matches;
document.addEventListener('pointermove',ev=>{if(!fine)return;const c=ev.target.closest&&ev.target.closest('.card,.panel');
if(c){const r=c.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;c.style.transform=`perspective(800px) rotateX(${(.5-y/r.height)*6}deg) rotateY(${(x/r.width-.5)*6}deg) translateY(-3px)`}
const b=ev.target.closest&&ev.target.closest('.cta .btn');if(b){const r=b.getBoundingClientRect();b.style.transform=`translate(${(ev.clientX-r.left-r.width/2)*.18}px,${(ev.clientY-r.top-r.height/2)*.3}px)`}});
document.addEventListener('pointerout',ev=>{const c=ev.target.closest&&ev.target.closest('.card,.panel,.cta .btn');if(c&&!c.contains(ev.relatedTarget))c.style.transform=''});
document.addEventListener('click',ev=>{const b=ev.target.closest('.btn,.chip,.cal button');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),o=document.createElement('span');o.className='rip';o.style.cssText=`width:${d}px;height:${d}px;left:${ev.clientX-r.left-d/2}px;top:${ev.clientY-r.top-d/2}px`;b.appendChild(o);setTimeout(()=>o.remove(),600)});
addEventListener('scroll',()=>{const h=document.documentElement;$('#pg').style.width=(scrollY/Math.max(1,h.scrollHeight-innerHeight)*100)+'%';$('nav').classList.toggle('sc',scrollY>8);$('#tp').classList.toggle('on',scrollY>600)},{passive:true});
addEventListener('hashchange',()=>{CUR=(location.hash||'#inicio').slice(1);msg='';route()});route();setInterval(()=>{const t=document.getElementById('tc');if(!t)return;const n=Date.now(),p=x=>String(x).padStart(2,'0'),d=new Date(n);t.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+':'+p(Math.floor(d.getMilliseconds()/41.7))},83);
</script>
